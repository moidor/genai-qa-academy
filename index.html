<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b30"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>GenAI QA Academy</title><style>
:root{color-scheme:dark;--bg:#0d1628;--panel:#16243b;--line:#34445e;--txt:#f0f5ff;--muted:#b5c3d8;--accent:#65dfcb;--warn:#ffd18a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,sans-serif}body.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--line:#cbd5e1;--txt:#14253b;--muted:#4c6078;--accent:#087c6f;--warn:#915a00}header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 18px}header>div,main{max-width:960px;margin:auto}header>div{display:flex;align-items:center;justify-content:space-between;gap:10px}small,.muted{color:var(--muted)}main{padding:24px 16px 90px}h1,h2,h3,p{margin:0 0 14px}h1{font-size:clamp(28px,6vw,44px);line-height:1.15;letter-spacing:-1.5px}h2{line-height:1.25}h3{line-height:1.3}button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:var(--accent);color:var(--bg);font-weight:750;border:0}button:disabled{opacity:.55;cursor:default}button.selected{border:2px solid var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.hero{background:linear-gradient(135deg,var(--panel),var(--bg));border:1px solid var(--line)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat{font-size:30px;font-weight:800;display:block;color:var(--accent)}.chapter{width:100%;margin:8px 0;display:block;padding:18px}.tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-right:5px;font-weight:700}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}.bar span{display:block;background:var(--accent);height:100%}.diagram{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:14px 0}.node{border:1px solid var(--accent);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:650}.arrow{color:var(--accent);font-weight:bold}.choice{display:block;width:100%;margin:8px 0}.good{border-color:var(--accent)!important}.bad{border-color:#f48787!important}.feedback{border-left:4px solid var(--accent);padding:12px;background:var(--bg);border-radius:8px}.feedback.wrong{border-color:#f48787}.note{border-left:3px solid var(--warn);padding-left:12px;color:var(--warn)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}nav button{font-size:14px;padding:8px 12px}footer{margin-top:28px;font-size:12px;color:var(--muted)}.timer{font-variant-numeric:tabular-nums;color:var(--warn);font-weight:700}.hidden{display:none}a{color:var(--accent)}@media(max-width:500px){.panel{padding:15px}header{padding:9px 12px}main{padding:18px 12px 60px}}

.eyebrow{font-size:12px;letter-spacing:1.6px;color:var(--accent);font-weight:750;margin-bottom:10px}.tile{position:relative;padding:18px;min-height:115px}.tile-arrow{position:absolute;right:15px;top:15px;color:var(--accent)}.tile h3{padding-right:24px}.grid.compact{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}.grid .panel{margin:4px 0 16px}.concept{border-left:3px solid var(--accent)}.example,.reference{background:var(--bg);border-radius:12px;padding:14px;margin-top:12px}.example p,.reason p{margin:4px 0 0}.reference details{margin-top:10px}.reason{padding:10px 0;border-top:1px solid var(--line)}.positive{color:var(--accent)}.negative{color:#f48787}body.light .negative{color:#b42318}details>summary{cursor:pointer;font-weight:650;padding:8px 0}details[open]>summary{margin-bottom:10px}select,input,textarea{display:block;width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;font:inherit;padding:10px;margin:6px 0 12px}textarea{resize:vertical}.formgrid label{display:block;font-weight:650}.hero{border-top:3px solid var(--accent)}.formgrid select{max-width:100%}footer button{display:block;margin-top:12px}.feedback{margin-top:16px}h1{margin-top:10px}.row button{max-width:100%}summary:focus-visible{outline:2px solid var(--accent)}
</style></head><body><header><div><strong>◈ GenAI QA Academy</strong><button id="theme" aria-label="Changer de thème">☀︎ / ☾</button></div><div><nav id="nav"><button data-view="home">Accueil</button><button data-view="bank">300 questions</button><button data-view="official">Examen officiel</button><button data-view="review">À revoir</button><button data-view="flash">Flashcards</button><button data-view="exam">Simulation</button><button id="install" class="hidden">Installer</button></nav></div></header><main id="app"></main><script src="content.js"></script><script src="bank.js"></script><script src="app.js"></script></body></html>
