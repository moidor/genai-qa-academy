/* v2.1 · sobre, responsive, sans dépendance graphique */
:root{--blue:#82c8ff;--purple:#bdabff;--gold:#ffcd76;--pink:#e5acee;--soft-accent:#17444a;--hero-end:#101d30;--shadow:0 3px 12px #00000012}

header{padding:12px 22px}
header>.header-shell{max-width:1280px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
main{max-width:1120px}
.ui-icon{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle}
.brand-row{display:flex;align-items:center;gap:8px;min-width:0}

nav button[aria-current="page"]{background:var(--soft-accent);color:var(--accent);font-weight:650}
nav button[aria-current="page"] .ui-icon{color:var(--accent)}
nav button.hidden{display:none}
.theme-toggle,.menu-toggle{width:42px;height:42px;display:grid;place-items:center;padding:0;border-radius:12px}
.menu-toggle{display:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hero.home-hero{background:linear-gradient(125deg,var(--panel),var(--hero-end));padding:24px;border-top:1px solid var(--line);box-shadow:var(--shadow)}
.home-hero h1{font-size:clamp(24px,3.2vw,36px);letter-spacing:-.8px;line-height:1.2}

.hero-progress{flex:1;min-width:0}
.hero-progress .bar{margin:0 0 6px;height:10px}
.hero-progress small{display:block;font-size:12px}
.hero-controls .primary{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.hero-controls .primary .ui-icon{width:18px;height:18px}
.home-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.metric{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.metric>.ui-icon{width:26px;height:26px}
.metric strong{display:block;font-size:clamp(19px,2.3vw,25px);letter-spacing:-.4px;line-height:1.2}
.metric small{display:block;font-size:12px;line-height:1.4;margin-top:3px}
.tone-blue{color:var(--blue)}.tone-purple{color:var(--purple)}.tone-gold{color:var(--gold)}.tone-pink{color:var(--pink)}.tone-accent{color:var(--accent)}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 5px}
.section-title>.ui-icon{color:var(--accent);width:27px;height:27px}
.section-intro{font-size:14px;margin-bottom:16px;color:var(--muted)}
.home-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.home-grid .tile{display:flex;align-items:center;gap:14px;padding:16px;min-height:96px;box-shadow:var(--shadow)}
.tile-symbol{flex:none;display:grid;place-items:center;width:34px}
.tile-symbol .ui-icon{width:30px;height:30px}
.tile-copy{flex:1;min-width:0}
.home-grid .tile h3{font-size:16px;margin:0 0 4px;padding:0;letter-spacing:-.15px}
.home-grid .tile small{font-size:13px;line-height:1.45;display:block}
.home-grid .tile-arrow{position:static;display:flex;align-items:center;color:var(--muted);flex:none}
.home-grid .tile-arrow .ui-icon{width:18px;height:18px}
.home-grid .tile:hover{border-color:var(--accent)}
.home-chapter{display:flex;align-items:center;gap:14px;min-height:88px}
.week-label{min-width:44px;padding:8px;border-radius:9px;color:var(--blue);background:var(--bg);border:1px solid var(--line);text-align:center;font-weight:700;font-size:13px}
.chapter-copy{flex:1;min-width:0}
.chapter-copy h3{margin:0 0 4px;font-size:16px}
.chapter-copy small{display:block;line-height:1.45}
.chapter-progress{width:150px;flex:none}
.chapter-progress small{display:block;text-align:right}
.chapter-progress .bar{margin:6px 0 0}
.home-chapter>.ui-icon{width:18px;height:18px;color:var(--muted)}

@media(max-width:360px){.brand strong{font-size:14px}.brand small{font-size:9px}.brand-row{gap:3px}.brand>.ui-icon{width:23px}.metric{padding:8px;gap:5px}.metric>.ui-icon{width:18px}.metric strong{font-size:18px}}
